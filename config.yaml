# CI Test Dashboard Configuration - medik8s operators
#
# Tracks Prow periodic test results for medik8s RHWA operators:
# FAR, SBR, SNR, NHC, NMO, MDR
#
# Data source: Prow GCS bucket (public, no auth needed)

# Data collector configuration
collector:
  type: "prow_gcs"

  # Prow GCS configuration
  prow_gcs:
    prow_url: "https://prow.ci.openshift.org"
    gcs_url: "https://gcsweb-ci.apps.ci.l2s4.p1.openshiftapps.com/gcs/test-platform-results-public"
    bucket: "test-platform-results-public"

    # Periodic job schedules (from Prow configs in openshift/release)
    job_schedules:
      far-nhc-interop-weekly-aws:
        label: FAR
        variant: "interop (NHC)"
        day: "Fri 12:00 UTC"
      sbr-weekly-aws-efs:
        label: SBR
        variant: "weekly (EFS)"
        day: "Wed 08:00 UTC"
      sbr-weekly-aws-odf:
        label: SBR
        variant: "weekly (ODF)"
        day: "Tue 08:00 UTC"
      nmo-weekly-aws:
        label: NMO
        variant: weekly
        day: "Thu 08:00 UTC"
      far-weekly-aws:
        label: FAR
        variant: weekly
        day: "Tue 04:00 UTC"
      nhc-weekly-aws:
        label: NHC
        variant: weekly
        day: "Fri 04:00 UTC"
      nhc-weekly-aws-disconnected:
        label: NHC
        variant: disconnected
        day: "Tue 12:00 UTC"
      sbr-weekly-aws-disconnected-nfs:
        label: SBR
        variant: disconnected
        day: "Wed 12:00/16:00 UTC"
      mdr-weekly-aws:
        label: MDR
        variant: weekly
        day: "Thu 04:00 UTC"
      snr-weekly-aws:
        label: SNR
        variant: weekly
        day: "Wed 04:00 UTC"
      snr-weekly-aws-disconnected:
        label: SNR
        variant: disconnected
        day: "Wed 12:00 UTC"
      far-weekly-aws-disconnected:
        label: FAR
        variant: disconnected
        day: "Jan 01 00:00 UTC"
      far-upgrade-aws:
        label: FAR
        variant: upgrade
        day: "Fri 08:00 UTC"
      tls13-adherence-all:
        label: TLS
        variant: "TLS 1.3 adherence (all operators)"
        day: "Mon 10:00 UTC"
      tls-pqc-readiness-all:
        label: TLS
        variant: "PQC readiness (all operators)"
        day: "Wed 10:00 UTC"
      far-daily-aws:
        label: FAR
        variant: "daily (upstream)"
        day: "Daily 04:00 UTC"
      sbr-daily-aws-odf:
        label: SBR
        variant: "daily (upstream, ODF)"
        day: "Daily 04:00 UTC"
      snr-daily-aws:
        label: SNR
        variant: "daily (upstream)"
        day: "Daily 04:00 UTC"
      mdr-daily-aws:
        label: MDR
        variant: "daily (upstream)"
        day: "Daily 04:00 UTC"
      nmo-daily-aws:
        label: NMO
        variant: "daily (upstream)"
        day: "Daily 04:00 UTC"
      nhc-daily-aws:
        label: NHC
        variant: "daily (upstream)"
        day: "Daily 04:00 UTC"

    # Periodic job patterns to track
    job_patterns:
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-far-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-far-nhc-interop-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-weekly-aws-odf"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-snr-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-mdr-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-nmo-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-nhc-weekly-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-weekly-aws-efs"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.21-disconnected-e2e-sbr-weekly-aws-disconnected-nfs"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-sbr-weekly-aws-disconnected-nfs"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-far-weekly-aws-disconnected"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-snr-weekly-aws-disconnected"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-nhc-weekly-aws-disconnected"
      - "periodic-ci-openshift-rhwa-system-tests-main-4.22-upgrade-e2e-far-upgrade-aws"
      # 5.0 TLS and upstream operator periodics
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-tls13-adherence-all"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-tls-pqc-readiness-all"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-far-daily-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-sbr-daily-aws-odf"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-snr-daily-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-mdr-daily-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-nmo-daily-aws"
      - "periodic-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-nhc-daily-aws"

    # Presubmit E2E jobs (triggered on system-tests PRs)
    presubmit_job_patterns:
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-far-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-far-nhc-interop-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-aws-odf"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-aws-efs"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-hypershift-aws-odf"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-sbr-hypershift-persistent-aws-odf"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-snr-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-nmo-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-mdr-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-konflux-e2e-nhc-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-far-aws-disconnected"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-snr-aws-disconnected"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-sbr-aws-disconnected-nfs"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-disconnected-e2e-nhc-aws-disconnected"
      - "pull-ci-openshift-rhwa-system-tests-main-4.22-upgrade-e2e-far-upgrade-presubmit-aws"
      # 5.0 upstream operator presubmits
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-far-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-sbr-aws-odf"
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-snr-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-mdr-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-nmo-aws"
      - "pull-ci-openshift-rhwa-system-tests-main-5.0-upstream-e2e-nhc-aws"
      # Dev repo E2E presubmit jobs (triggered on operator PRs)
      - "pull-ci-medik8s-fence-agents-remediation-main-4.22-openshift-e2e"
      - "pull-ci-medik8s-storage-based-remediation-main-4.20-openshift-e2e"
      - "pull-ci-medik8s-self-node-remediation-main-4.22-openshift-e2e"
      # 5.0 operator-repo E2E (from *-main__5.0.yaml)
      - "pull-ci-medik8s-fence-agents-remediation-main-5.0-openshift-e2e"
      - "pull-ci-medik8s-storage-based-remediation-main-5.0-openshift-e2e"
      - "pull-ci-medik8s-self-node-remediation-main-5.0-openshift-e2e"
      - "pull-ci-medik8s-node-healthcheck-operator-main-5.0-openshift-e2e"
      - "pull-ci-medik8s-node-maintenance-operator-main-5.0-openshift-e2e"
      - "pull-ci-medik8s-machine-deletion-remediation-main-5.0-openshift-e2e"

  # ReportPortal (disabled - uncomment and set values)
  # reportportal:
  #   url: "https://your-reportportal.example.com"
  #   project: "your-project"
  #   # API token: REPORTPORTAL_API_TOKEN env var
  #   job_patterns:
  #     - "periodic-ci-your-team-*"

# Tracking configuration
tracking:
  versions:
    - "4.21"
    - "4.22"
    - "5.0"

  test_suite_filter: ""

  # Weekly jobs need longer lookback than daily
  lookback_days: 90

  blocklist: []

# Database configuration
database:
  path: "/data/dashboard.db"

# Web server configuration
web:
  host: "0.0.0.0"
  port: 8080
  debug: false

# Collection schedule (for automated runs via CronJob)
schedule:
  enabled: false
  cron: "0 8 * * *"
