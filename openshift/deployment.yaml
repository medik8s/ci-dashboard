apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-dashboard
  labels:
    app: ci-dashboard
    paas.redhat.com/appcode: ISVD-001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-dashboard
  template:
    metadata:
      labels:
        app: ci-dashboard
        paas.redhat.com/appcode: ISVD-001
    spec:
      containers:
      - name: dashboard
        image: quay.io/medik8s-qe/ci-dashboard:latest
        workingDir: /app
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: PROW_GANGWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: gangway-token
              key: PROW_GANGWAY_TOKEN
        - name: KONFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: konflux-token
              key: token
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/run/vertex-ai-sa/key.json
        - name: ANTHROPIC_VERTEX_PROJECT_ID
          value: medik8s-qe-ci-dashboard
        - name: CLOUD_ML_REGION
          value: global
        volumeMounts:
        - name: data
          mountPath: /data
        - name: vertex-ai-sa
          mountPath: /var/run/vertex-ai-sa
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: data
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: vertex-ai-sa
        secret:
          secretName: vertex-ai-sa
